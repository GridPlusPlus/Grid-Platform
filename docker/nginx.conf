# Keep the scheme reported by the outer TLS proxy; fall back to this hop's.
map $http_x_forwarded_proto $grid_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    client_max_body_size 6m;
    # Resolve the app at request time through Docker DNS, so recreating the
    # app container (new IP) never requires restarting this nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /static/ {
        alias /usr/share/nginx/html/;
    }

    location / {
        # Unique alias: a bare "app" could resolve to another project's
        # container on the shared edge network.
        set $grid_app http://gridplusplus-platform-app:8000;
        proxy_pass $grid_app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $grid_forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
    }
}
