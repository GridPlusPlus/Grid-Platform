name: gridplusplus

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/usr/share/nginx/html:ro
    expose:
      - "80"
    networks:
      default: {}
      # The outer reverse proxy reaches this service as http://gridplusplus.
      edge:
        aliases: [gridplusplus]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/grid_platform.db
    volumes:
      - grid_data:/data
      - grid_oauth_config:/run/grid-oauth:ro
    networks:
      default:
        aliases: [gridplusplus-platform-app]
      # Gitea OAuth token/userinfo calls go to http://gridplusplus-git:3000,
      # which only exists on the shared edge network.
      edge: {}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-nginx}

volumes:
  grid_data:
  grid_oauth_config:
    external: true
    name: grid_oauth_config
