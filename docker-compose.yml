name: gridplusplus

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/usr/share/nginx/html:ro
    expose:
      - "80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////data/grid_platform.db
    volumes:
      - grid_data:/data
      - grid_oauth_config:/run/grid-oauth:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  grid_data:
  grid_oauth_config:
    external: true
    name: grid_oauth_config
